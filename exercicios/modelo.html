<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Aula</title>
</head>
<body>

  <!-- PARTE 1: Onde o resultado vai aparecer -->
  <h2 id="tela">Aguardando...</h2>

  <!-- PARTE 2: A lógica JavaScript -->
  <script>
    // Lógica aqui...
    let mensagem = "Olá, turma!";

    // PARTE 3: O 'empurrão' para a tela, detalhe, o innerText é o que vai aparecer na tela, 
    // se fosse innerHTML, poderia colocar tags HTML
    document.getElementById("tela").innerText = mensagem;
  </script>

</body>
</html>
